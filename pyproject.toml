[project]
name = "itla-tickets-api"
version = "2.0.0"
description = "Stateless Campus Virtual ticket automation API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "playwright>=1.58,<2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = ["ruff>=0.15", "pytest>=8", "pytest-asyncio>=1", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: opt-in tests against real browser or Campus Virtual"]
addopts = "-m 'not live'"
